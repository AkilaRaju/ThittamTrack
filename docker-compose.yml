services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thittamtrack
      POSTGRES_USER: thittamtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thittamtrack -d thittamtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      APP_NAME: ThittamTrack
      DATABASE_URL: postgresql://thittamtrack:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/thittamtrack
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
